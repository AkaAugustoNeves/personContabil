<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    html, body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background: #7159c1;
    }
    .container {
        display: grid;
        grid-template: 5vh 90vh 5vh/0.5fr 1fr 1fr 1fr;
        grid-template-areas:
          "a h h h"
          "a m m m"
          "a f f f";
    }

    header {
        background: yellow;
        height: 100%;
        grid-area: h;
    }

    main {
        background: blue;
        height: 100%;
        grid-area: m;
    }

    aside {
        background: green;
        height: 100%;
        grid-area: a;
    }

    footer {
        background: red;
        height: 100%;
        grid-area: f;
    }
    </style>
</head>
<body>
    <div class="container">
        <header></header>
        <aside></aside>
        <main></main>
        <footer></footer>
    </div>
</body>
</html>
